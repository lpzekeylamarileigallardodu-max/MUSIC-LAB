name: academia-jaime-gallardo

services:
  db:
    image: postgres:16-alpine
    container_name: academia-jaime-gallardo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: academia_jaime_gallardo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Chinino10}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./database/academia_jaime_gallardo_db.sql:/docker-entrypoint-initdb.d/01_academia.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academia_jaime_gallardo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  datos_db:
