spring:
  application:
    name: academia
  datasource:
    url: jdbc:postgresql://localhost:5433/academia_jaime_gallardo   # base en Docker (docker-compose.yml)
    username: postgres
    password: Chinino10
  servlet:
    multipart:
      max-file-size: 20MB     # comprobantes (máx. 5 MB, se revisa aparte) y material de apoyo
      max-request-size: 21MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}   # correo de Gmail que envía los avisos (escríbelo aquí)
    password: ${MAIL_PASSWORD:}   # contraseña de aplicación de Gmail (no la normal)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

academia:
  archivos:
    directorio: uploads       # aquí se guardan las fotos de los comprobantes (backend/uploads/comprobantes)
  correo:
    remitente: ${MAIL_USERNAME:}
