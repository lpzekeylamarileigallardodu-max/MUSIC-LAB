spring:
  application:
    name: academia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/academia_jaime_gallardo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Chinino10}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

academia:
  archivos:
    directorio: uploads
  correo:
    remitente: ${MAIL_USERNAME:}
